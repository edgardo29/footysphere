name: backend-ci  # CI for the FastAPI backend

on:
  # Run CI on PRs that modify backend/, etl/ (tests import from there), or this workflow file
  pull_request:
    paths:
      - 'backend/**'
      - 'etl/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  build-test:
    runs-on: ubuntu-latest

    # ─────────────────────────────────────
    # Test DB environment variables (used by DB_TEST_CREDENTIALS)
    # ─────────────────────────────────────
    env:
      # In GitHub Actions, the Postgres service is reachable from the runner at localhost:5432
      DB_HOST: localhost
      DB_PORT: 5432

      # These should be set as GitHub Secrets (recommended)
      DB_TEST_NAME: ${{ secrets.DB_TEST_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    # ─────────────────────────────────────
    # Temporary Postgres DB for integration tests
    # ─────────────────────────────────────
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ secrets.DB_TEST_NAME }}
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 5432:5432

        # Healthcheck should use the same user/db we created, not postgres/postgres
        options: >-
          --health-cmd="pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # All shell steps below execute inside backend/
    defaults:
      run:
        working-directory: backend

    steps:
      # 1) Check out the repository at the PR commit/SHA
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Match VM Python version; enable pip cache keyed to your deps file
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'                    # <- your VM is 3.12.x
          cache: 'pip'                              # <- speed up installs
          cache-dependency-path: backend/requirements_api.txt  # <- EXACT file

      # 3) Install backend dependencies from YOUR exact file name
      - name: Install dependencies
        run: pip install -r requirements_api.txt

      # 3.5) Install psql client so we can apply schema SQL
      - name: Install Postgres client (psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # 3.55) Wait until Postgres is actually reachable before applying schema
      # (healthcheck can still race a tiny bit)
      - name: Wait for Postgres to be ready
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          for i in {1..30}; do
            psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_TEST_NAME" -c "SELECT 1;" && break
            sleep 1
          done

      # 3.6) Create the test schema in the fresh CI Postgres
      - name: Create test schema
        env:
          PGPASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          psql \
            -h "$DB_HOST" \
            -p "$DB_PORT" \
            -U "$DB_USER" \
            -d "$DB_TEST_NAME" \
            -f tests/schema_test.sql

      # 4) Run tests only if a tests/ folder exists (auto-skip otherwise)
      - name: Run tests (if present)
        if: ${{ hashFiles('backend/tests/**') != '' }}
        run: pytest -q
